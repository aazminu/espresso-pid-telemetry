[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "espresso-pid-telemetry"
version = "0.2.0"
description = "Specialty coffee espresso extraction PID thermal simulation, Darcy puck resistance & channeling detector, refractometry EY%, and roast RoR/DTR profiler."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Abdullah Azmi", email = "m4u5t4@u.northwestern.edu" }
]
keywords = ["espresso", "coffee", "pid-controller", "darcy-law", "telemetry", "roast-profiling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.urls]
Homepage = "https://abdullahazmi.com"
Repository = "https://github.com/aazminu/espresso-pid-telemetry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
